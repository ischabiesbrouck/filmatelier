<!doctype html>
<html lang="nl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Filmatelier</title>
  <meta name="description" content="Bedenk, schrijf en produceer je speelfilm: ideeën, structuur, scenario, breakdown, draaischema, callsheets, budget en meer — volledig offline.">
  <meta name="theme-color" content="#ececec">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Manrope:wght@200;300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    document.documentElement.dataset.theme = 'light';
    try { const s = JSON.parse(localStorage.getItem('filmatelier.settings') || '{}'); if (s.theme) document.documentElement.dataset.theme = s.theme; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"><p style="padding:24px;color:#6e6e73;font-family:system-ui">Filmatelier laden…</p></div>
  <noscript><p style="padding:24px">Filmatelier heeft JavaScript nodig.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
